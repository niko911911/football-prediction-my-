<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>足球比分预测</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="max-w-5xl mx-auto p-4">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold">⚽ 足球比分预测</h1>
      <div class="flex items-center gap-2 text-sm">
        <span id="clock" class="text-slate-500"></span>
        <span class="px-2 py-1 bg-green-100 text-green-700 rounded">每 5 秒刷新</span>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- 比赛列表 -->
      <section class="md:col-span-1 bg-white rounded-xl shadow p-3">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold">比赛列表</h2>
          <select id="leagueFilter" class="text-sm border rounded px-1 py-0.5">
            <option value="">全部联赛</option>
          </select>
        </div>
        <div id="matchList" class="space-y-2"></div>
      </section>

      <!-- 比赛详情与预测 -->
      <section class="md:col-span-2 bg-white rounded-xl shadow p-4">
        <div id="detail" class="text-slate-400">点击左侧比赛查看详情与预测</div>
      </section>
    </div>
  </div>

  <script>
    const API = "/api";
    let selectedId = null;
    let league = "";

    function todayUTC() {
      return new Date().toISOString().slice(0, 10);
    }

    function statusBadge(s) {
      if (s === "live") return '<span class="text-xs px-1.5 py-0.5 bg-red-100 text-red-600 rounded">LIVE</span>';
      if (s === "finished") return '<span class="text-xs px-1.5 py-0.5 bg-slate-200 text-slate-600 rounded">完场</span>';
      return '<span class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded">未开始</span>';
    }

    function pct(x) {
      return (x * 100).toFixed(1) + "%";
    }

    function probBar(label, prob, color) {
      return `<div class="border rounded-lg p-2">
        <div class="text-xs text-slate-500">${label}</div>
        <div class="font-bold">${pct(prob)}</div>
        <div class="h-1.5 bg-slate-200 rounded mt-1 overflow-hidden">
          <div class="${color} h-full" style="width:${pct(prob)}"></div>
        </div>
      </div>`;
    }

    async function loadMatches() {
      let url = API + "/matches?date=" + todayUTC();
      if (league) url += "&league=" + encodeURIComponent(league);
      const res = await fetch(url);
      const matches = await res.json();
      renderList(matches);
      if (selectedId && matches.find((m) => m.id === selectedId)) {
        loadDetail(selectedId);
      }
    }

    function renderList(matches) {
      const el = document.getElementById("matchList");
      if (!matches.length) {
        el.innerHTML = '<div class="text-slate-400 text-sm">暂无比赛</div>';
        return;
      }
      el.innerHTML = matches
        .map(
          (m) => `
        <div data-id="${m.id}" class="cursor-pointer border rounded-lg p-2 hover:bg-slate-50 ${
          m.id === selectedId ? "border-blue-400 bg-blue-50" : ""
        }">
          <div class="flex justify-between text-xs text-slate-500">
            <span>${m.league} ${m.round}</span>${statusBadge(m.status)}
          </div>
          <div class="flex justify-between items-center mt-1">
            <span class="font-medium">${m.home_team.name}</span>
            <span class="font-bold text-lg">${m.home_score} - ${m.away_score}</span>
            <span class="font-medium">${m.away_team.name}</span>
          </div>
        </div>`
        )
        .join("");
      el.querySelectorAll("[data-id]").forEach((d) => {
        d.onclick = () => selectMatch(Number(d.dataset.id));
      });

      const sel = document.getElementById("leagueFilter");
      [...new Set(matches.map((m) => m.league))].forEach((l) => {
        if (![...sel.options].some((o) => o.value === l)) {
          const o = document.createElement("option");
          o.value = l;
          o.text = l;
          sel.appendChild(o);
        }
      });
    }

    async function selectMatch(id) {
      selectedId = id;
      await loadDetail(id);
    }

    async function loadDetail(id) {
      const [mRes, pRes] = await Promise.all([
        fetch(API + "/matches/" + id),
        fetch(API + "/matches/" + id + "/prediction"),
      ]);
      if (!mRes.ok) {
        document.getElementById("detail").textContent = "比赛不存在";
        return;
      }
      const m = await mRes.json();
      const p = pRes.ok ? await pRes.json() : null;
      renderDetail(m, p);
    }

    function renderDetail(m, p) {
      let html = `
        <div class="flex items-center justify-between">
          <div class="text-sm text-slate-500">${m.league} · ${m.round}</div>
          ${statusBadge(m.status)}
        </div>
        <div class="text-center my-3">
          <div class="text-xl font-semibold">
            ${m.home_team.name}
            <span class="text-3xl font-bold mx-2">${m.home_score} - ${m.away_score}</span>
            ${m.away_team.name}
          </div>
        </div>`;
      if (p) {
        html += `
        <div class="grid grid-cols-3 gap-2 my-3 text-center">
          ${probBar("主胜", p.home_win_prob, "bg-red-500")}
          ${probBar("平", p.draw_prob, "bg-slate-400")}
          ${probBar("客胜", p.away_win_prob, "bg-green-500")}
        </div>
        <div class="text-sm text-slate-500 mb-1">
          预期进球：主 ${p.expected_home_goals} / 客 ${p.expected_away_goals}
        </div>
        <div class="font-semibold mt-3 mb-1">Top3 最可能比分</div>
        <div class="flex gap-2">
          ${p.top_scores
            .map(
              (s) => `<div class="flex-1 border rounded-lg p-2 text-center">
                <div class="text-lg font-bold">${s.home}:${s.away}</div>
                <div class="text-xs text-slate-500">${pct(s.probability)}</div>
              </div>`
            )
            .join("")}
        </div>`;
      } else {
        html += '<div class="text-slate-400">暂无预测数据</div>';
      }
      document.getElementById("detail").innerHTML = html;
    }

    document.getElementById("leagueFilter").onchange = (e) => {
      league = e.target.value;
      loadMatches();
    };

    async function tick() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
      await loadMatches();
    }

    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
